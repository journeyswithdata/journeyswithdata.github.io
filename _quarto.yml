project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - profile.jpg
    - .nojekyll

website:
  title: "Journeys With Data"
  description: "Notes on data science, AI and the systems that keep the lights on — by a data scientist working in regulated energy infrastructure."
  site-url: https://journeyswithdata.dev
  favicon: favicon.svg
  image: profile.jpg
  search: true
  open-graph: true
  twitter-card: true
  back-to-top-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: writing.qmd
        text: Writing
      - href: work.qmd
        text: Work
      - href: about.qmd
        text: About
    right:
      - icon: rss
        href: writing.xml
        aria-label: RSS feed
      - icon: github
        href: https://github.com/journeyswithdata
        aria-label: GitHub
  page-footer:
    left: "Journeys With Data"
    center: "*Some posts are maps. Some are sketches.*"
    right: "v1.0 · 2026"

format:
  html:
    theme: [cosmo, brand, theme.scss]
    highlight-style: github
    toc: false
    grid:
      body-width: 1100px
      sidebar-width: 260px
      margin-width: 300px
    anchor-sections: false
